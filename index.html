<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neon City Lobby</title>
  <style>
    :root{--cyan:#38e8ff;--violet:#8b5cf6;--pink:#ff4ecd;--panel:rgba(8,14,30,.78)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#050916}
    .city{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#101a3c 0%,#090d22 55%,#050711 100%);filter:blur(1.2px)}
    .city:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(110,65,255,.32),transparent 35%),linear-gradient(90deg,transparent 48%,rgba(50,220,255,.22) 50%,transparent 52%)}
    .moon{position:absolute;top:10%;left:16%;width:100px;height:100px;border-radius:50%;background:#bceeff;box-shadow:0 0 55px #38e8ff;opacity:.75}
    .buildings{position:absolute;bottom:16%;left:0;right:0;height:62%;display:flex;align-items:end;gap:1.3%;padding:0 2%}
    .building{position:relative;flex:1;min-width:5%;background:linear-gradient(90deg,#10172f,#1d2851,#0b1128);border:1px solid rgba(81,213,255,.18);box-shadow:0 0 25px rgba(32,179,255,.16)}
    .building:nth-child(2n){height:72%}.building:nth-child(3n){height:92%}.building:nth-child(4n){height:53%}.building:nth-child(5n){height:82%}
    .building:after{content:"";position:absolute;inset:8% 18%;background:repeating-linear-gradient(180deg,rgba(71,224,255,.55) 0 3px,transparent 3px 21px),repeating-linear-gradient(90deg,transparent 0 12px,rgba(255,79,211,.4) 12px 16px,transparent 16px 30px);opacity:.7}
    .road{position:absolute;bottom:0;left:0;right:0;height:18%;background:linear-gradient(90deg,#070b17,#15152a,#070b17);border-top:2px solid rgba(56,232,255,.35);transform:perspective(300px) rotateX(16deg);box-shadow:0 -14px 35px rgba(56,232,255,.13)}
    .road:after{content:"";position:absolute;top:48%;left:0;right:0;border-top:3px dashed #ffd66b;opacity:.65}
    .overlay{position:relative;z-index:2;min-height:100vh;padding:26px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(3,6,18,.65),transparent 35%,transparent 65%,rgba(3,6,18,.55))}
    header{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:clamp(25px,4vw,48px);font-weight:900;letter-spacing:2px;text-shadow:0 0 18px var(--cyan)}.brand span{color:var(--pink)}
    .badge{padding:10px 16px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(7,12,29,.65);backdrop-filter:blur(8px)}
    .center{align-self:center;text-align:center;width:min(620px,100%);margin-top:-30px}.center h1{font-size:clamp(34px,7vw,76px);margin:0 0 10px;text-shadow:0 0 28px var(--violet)}.center p{color:#d7e8ff;font-size:18px}
    .menu{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:25px}.btn{border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:15px 23px;color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(34,211,238,.85));font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 0 20px rgba(56,232,255,.15);transition:.2s}.btn:hover{transform:translateY(-3px);box-shadow:0 0 26px rgba(56,232,255,.45)}
    .cards{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.card{min-width:155px;padding:15px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px)}.card b{display:block;color:var(--cyan);margin-bottom:6px}.hint{font-size:13px;color:#b6c3dc}
    .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);opacity:0;padding:13px 20px;border-radius:12px;background:#111a35;border:1px solid var(--cyan);transition:.25s;z-index:4}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:600px){.overlay{padding:18px}.badge{font-size:12px}.center{margin-top:0}.cards .card{min-width:130px}.card{font-size:13px}}
  </style>
</head>
<body>
  <div class="city"><div class="moon"></div><div class="buildings"> <i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i><i class="building"></i></div><div class="road"></div></div>
  <div class="overlay">
    <header><div class="brand">NEON <span>CITY</span></div><div class="badge">● متصل الآن</div></header>
    <main class="center"><h1>اللوبي الرئيسي</h1><p>استكشف المدينة، اختر وجهتك، وابدأ مغامرتك.</p><div class="menu"><button class="btn" data-msg="تم بدء الاستكشاف في وسط المدينة">ابدأ الاستكشاف</button><button class="btn" data-msg="المتجر سيفتح قريبًا">المتجر</button><button class="btn" data-msg="ملفك الشخصي جاهز">الملف الشخصي</button></div></main>
    <section class="cards"><div class="card"><b>وسط المدينة</b><span class="hint">أضواء ومبانٍ نيون</span></div><div class="card"><b>الميناء</b><span class="hint">منطقة قادمة قريبًا</span></div><div class="card"><b>الحديقة</b><span class="hint">منطقة قادمة قريبًا</span></div></section>
  </div><div id="toast" class="toast"></div>
  <script>const toast=document.getElementById('toast');document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>{toast.textContent=b.dataset.msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)});</script>
</body>
</html>
