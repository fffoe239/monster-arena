<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حارتنا</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial;color:#fff;background:#152443}button{border:0;border-radius:10px;padding:10px 14px;background:#f3a719;font-weight:bold;cursor:pointer;touch-action:manipulation}.hidden{display:none!important}.game{height:100vh;position:relative;overflow:hidden;background:linear-gradient(#1d3564 0 38%,#746d61 38% 49%,#1d222b 49%)}.sky{position:absolute;inset:12% 0 34%;display:flex;gap:5px;align-items:end;opacity:.75}.sky i{flex:1;height:70%;background:linear-gradient(90deg,#111a35,#36507f,#11182f);border:1px solid #6682a4}.sky i:nth-child(2n){height:88%}.road{position:absolute;bottom:0;width:100%;height:34%;background:#151923;border-top:8px solid #aaa18f}.road:after{content:"";position:absolute;top:50%;width:100%;border-top:4px dashed #d8aa45}.car{position:absolute;z-index:2;bottom:13%;left:-150px;width:110px;height:38px;border-radius:14px 18px 6px 6px;background:#e94560;box-shadow:0 15px 0 -7px #080a0f;animation:drive 8s linear infinite}.car:before{content:"";position:absolute;left:22px;top:-17px;width:58px;height:22px;border-radius:14px 14px 0 0;background:#65c7df}.car:after{content:"";position:absolute;left:12px;bottom:-9px;width:16px;height:16px;border-radius:50%;background:#111;box-shadow:70px 0 #111}@keyframes drive{to{left:110%}}.car.two{bottom:24%;background:#36a269;animation-duration:11s;animation-delay:3s}.hud{position:relative;z-index:5;background:#06101ddd;padding:12px 17px;display:flex;justify-content:space-between;flex-wrap:wrap}.brand{font-size:25px;color:#5eeaff;font-weight:bold}.stat{display:inline-block;padding:7px;margin:3px;background:#ffffff18;border-radius:8px}.tools{position:relative;z-index:20;text-align:center;padding:9px}.people{position:absolute;z-index:3;bottom:37%;left:4%;right:4%;display:flex;justify-content:space-around}.npc{text-align:center;cursor:pointer}.npc span{display:block;background:#111a2aee;padding:5px;border-radius:7px;font-size:12px}.person{width:43px;height:76px;margin:auto;border-radius:19px 19px 8px 8px;border:2px solid #252c3b;background:#eee;box-shadow:0 18px 0 -6px #252c3b;position:relative}.person:before{content:"";position:absolute;top:-23px;left:7px;width:26px;height:26px;border-radius:50%;background:#a96843;border:2px solid #301b18}.npc:nth-child(2) .person{background:#254b75}.npc:nth-child(3) .person{background:#171923}.npc:nth-child(4) .person{background:#784b35}.player{position:absolute;z-index:6;bottom:38%;right:17%;width:43px;height:78px;border-radius:19px;background:#38e8ff;border:2px solid #164e63;transition:1s;box-shadow:0 18px 0 -6px #123b55}.player.move{right:48%}.panel{position:absolute;z-index:50;top:70px;left:50%;transform:translateX(-50%);width:min(480px,92vw);max-height:86vh;overflow:auto;padding:20px;background:#0b1426f7;border:1px solid #ffffff44;border-radius:16px;text-align:center}.items,.seq{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:14px}.item,.seq button{background:#33415d;color:#fff}.seq button.correct{background:#159447!important;color:#fff}.seq button.wrong{background:#c62828!important;color:#fff}.timer{font-size:28px;color:#ffd166}.notice{position:absolute;z-index:60;top:85px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#101a30ee;border:1px solid #5eeaff;border-radius:9px;opacity:0}.notice.show{opacity:1}.sell-row{display:flex;justify-content:space-between;align-items:center;background:#ffffff12;padding:9px;border-radius:9px;margin:7px 0}.refresh{color:#ffd166}.chase{border-color:#f33}.chase h2{color:#ff6262}.speed{background:#e63946;color:#fff;font-size:21px}.dead{position:fixed;inset:0;z-index:100;background:#080000ee;display:grid;place-items:center;text-align:center}.dead .box{background:#190b0b;border:1px solid #f33;border-radius:15px;padding:25px}.out{animation:out 1.2s forwards}@keyframes out{to{transform:translateX(-160vw);opacity:0}}</style></head><body><main class="game"><div class="sky"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="road"></div><div class="car"></div><div class="car two"></div><header class="hud"><b class="brand">حارتنا</b><div><span class="stat">❤ <b id="hp">100</b></span><span class="stat">💰 <b id="money">0</b></span><span class="stat">🎒 <b id="bag">0</b></span></div></header><div class="tools"><button id="shop" type="button">🏪 البقالة</button> <button id="vendor" type="button">💼 البايع</button> <button id="reset" type="button">↻ إعادة</button></div><div id="notice" class="notice"></div><div id="player" class="player"></div><div id="people" class="people"></div><div id="loot" class="panel hidden"><h2>أغراض الشخص</h2><p>باقي <b id="lootTime">10</b> ثوانٍ</p><div id="items" class="items"></div><button id="steal" type="button">سرقة الغرض</button> <button class="close" type="button">إغلاق</button></div><div id="challenge" class="panel hidden"><h2>تحدي السرقة</h2><p>اضغط الأرقام بالترتيب.</p><div id="seq" class="seq"></div><div class="timer"><b id="time">8</b></div><button id="cancel" type="button">إلغاء</button></div><div id="chase" class="panel hidden chase"><h2>وقفففف!</h2><p>صاحب الغرض يلحقك. اضغط 5 مرات.</p><p><b id="presses">0</b>/5</p><button id="speed" class="speed" type="button">🏃 أسرع</button></div><div id="vendorPanel" class="panel hidden"><h2>البايع</h2><p class="refresh">تتجدد الأسعار بعد <b id="priceTime">5:00</b></p><div id="sellList"></div><button class="close" type="button">إغلاق</button></div><div id="shopPanel" class="panel hidden"><h2>البقالة</h2><button data-buy="10" data-heal="10">ماء - 10</button> <button data-buy="20" data-heal="20">أكل - 20</button> <button class="close" type="button">إغلاق</button></div></main><div id="dead" class="dead hidden"><div class="box"><h1>انتهت المطاردة</h1><button id="revive" type="button">إحياء والعودة للحارة</button></div></div><script>
const names=['فهد','سالم','أبو راشد','نورة','خالد','ماجد','تركي','ريم'],base=['أكل','شرب','جوال','سماعة','شاحن','كتاب','قارورة مويه'],ranges={'كتاب':[10,25],'شاحن':[25,40],'سماعة':[50,75],'قارورة مويه':[1,7],'أكل':[1,7],'شرب':[1,7],'جوال':[700,1200],'سلاح خيالي':[1400,2100]};let hp=100,money=0,bagItems=[],personItems=[],target='',lootTimer,challengeTimer,priceTimer,order=[],pressed=[],esc=0,prices={},priceLeft=300;const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);function hud(){$('#hp').textContent=hp;$('#money').textContent=money;$('#bag').textContent=bagItems.length}function msg(x){$('#notice').textContent=x;$('#notice').className='notice show';setTimeout(()=>$('#notice').className='notice',2200)}function close(){ $$('.panel').forEach(x=>x.classList.add('hidden'));clearInterval(lootTimer);$('#player').classList.remove('move')}function renderPeople(){$('#people').innerHTML=names.slice(0,4).map((n,i)=>`<div class="npc" data-i="${i}"><div class="person"></div><span>${n}</span></div>`).join('');$$('.npc').forEach(x=>x.onclick=()=>inspect(+x.dataset.i))}function inspect(){close();$('#player').classList.add('move');setTimeout(()=>{personItems=[...base].sort(()=>Math.random()-.5).slice(0,4);if(Math.random()<.1)personItems.push('سلاح خيالي');target='';$('#items').innerHTML=personItems.map(x=>`<button class="item" data-item="${x}">${x}</button>`).join('');$('#loot').classList.remove('hidden');let t=10;$('#lootTime').textContent=t;lootTimer=setInterval(()=>{$('#lootTime').textContent=--t;if(t<=0){clearInterval(lootTimer);chase()}},1000);$$('[data-item]').forEach(b=>b.onclick=()=>{target=b.dataset.item;$$('[data-item]').forEach(x=>x.style.outline='');b.style.outline='2px solid #5eeaff'})},500)}function startSteal(){if(!target)return msg('اختر غرضًا أولًا');clearInterval(lootTimer);$('#loot').classList.add('hidden');order=[0,1,2,3].sort(()=>Math.random()-.5);pressed=[];$('#seq').innerHTML=order.map((x,i)=>`<button data-k="${x}" type="button">${x+1}</button>`).join('');$$('[data-k]').forEach(b=>b.onclick=()=>{let chosen=+b.dataset.k,expected=order[pressed.length];pressed.push(chosen);b.disabled=true;b.classList.add(chosen===expected?'correct':'wrong');if(pressed.length===4){clearInterval(challengeTimer);setTimeout(()=>pressed.every((v,i)=>v===order[i])?win():chase(),250)}});let t=8;$('#time').textContent=t;$('#challenge').classList.remove('hidden');challengeTimer=setInterval(()=>{if(--t<=0){clearInterval(challengeTimer);chase()}$('#time').textContent=t},1000)}function win(){close();let i=personItems.indexOf(target);if(i>=0)personItems.splice(i,1);bagItems.push(target);target='';hud();msg('تمت السرقة وأضيف الغرض إلى شنطتك')}function chase(){clearInterval(lootTimer);clearInterval(challengeTimer);close();$('#chase').classList.remove('hidden');esc=0;$('#presses').textContent=0;msg('صاحب الغرض يلحقك!')}function run(){if(++esc>=5){close();$('#player').classList.add('out');setTimeout(()=>{$('#player').classList.remove('out');msg('هربت')},1200)}else $('#presses').textContent=esc}function randomPrice(x){let r=ranges[x]||[1,7];return Math.floor(Math.random()*(r[1]-r[0]+1))+r[0]}function refreshPrices(){prices={};bagItems.forEach(x=>{if(prices[x]===undefined)prices[x]=randomPrice(x)});priceLeft=300;renderSales()}function renderSales(){let c={};bagItems.forEach(x=>c[x]=(c[x]||0)+1);$('#sellList').innerHTML=Object.keys(c).length?Object.keys(c).map(x=>`<div class="sell-row"><span>${x} ×${c[x]}<br><b>${prices[x]}</b> عملة للواحد</span><button data-sell="${x}">بيع واحد</button></div>`).join(''):'<p>ما عندك أغراض. أسرق غرضًا أولًا ثم تعال.</p>';$$('[data-sell]').forEach(b=>b.onclick=()=>{let i=bagItems.indexOf(b.dataset.sell);if(i>=0){money+=prices[b.dataset.sell];bagItems.splice(i,1);delete prices[b.dataset.sell];hud();renderSales();msg('تم البيع')}})}function tickPrice(){priceLeft--;$('#priceTime').textContent=Math.floor(priceLeft/60)+':'+String(priceLeft%60).padStart(2,'0');if(priceLeft<=0)refreshPrices()}$('#steal').onclick=startSteal;$('#cancel').onclick=close;$('#speed').onclick=run;$('#vendor').onclick=()=>{close();renderSales();$('#vendorPanel').classList.remove('hidden')};$('#shop').onclick=()=>{close();$('#shopPanel').classList.remove('hidden')};$('#revive').onclick=()=>{hp=100;$('#dead').classList.add('hidden');$('#chase').classList.add('hidden');close();hud()};$('#reset').onclick=()=>{hp=100;money=0;bagItems=[];close();hud()};$$('.close').forEach(b=>b.onclick=close);$$('[data-buy]').forEach(b=>b.onclick=()=>{let p=+b.dataset.buy;if(money>=p){money-=p;hp=Math.min(100,hp+ +b.dataset.heal);hud();msg('تم الشراء')}else msg('العملات غير كافية')});setInterval(tickPrice,1000);setInterval(()=>{names.push(names.shift());renderPeople();msg('تجددت الأغراض والأسماء')},180000);refreshPrices();renderPeople();hud();</script></body></html>
